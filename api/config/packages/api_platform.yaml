api_platform:
    mapping:
        paths: ['%kernel.project_dir%/src/Entity']
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']
    # the API entrypoint ("/") negotiates against the docs formats, 2.x served application/json there
    docs_formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
        yamlopenapi: ['application/vnd.openapi+yaml']
    patch_formats:
        json: ['application/merge-patch+json']
    swagger:
        versions: [3]
    serializer:
        hydra_prefix: true
